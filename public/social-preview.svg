<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="60" fill="rgba(255,255,255,0.1)"/>
  <circle cx="1100" cy="530" r="80" fill="rgba(255,255,255,0.1)"/>
  <circle cx="1050" cy="150" r="40" fill="rgba(255,255,255,0.15)"/>
  
  <!-- Main content area -->
  <rect x="150" y="150" width="900" height="330" rx="20" fill="rgba(255,255,255,0.95)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  
  <!-- Logo section -->
  <circle cx="300" cy="315" r="80" fill="url(#bgGradient)" stroke="#ffffff" stroke-width="3"/>
  
  <!-- Flashcard stack in logo -->
  <rect x="260" y="295" width="40" height="25" rx="3" fill="url(#cardGradient)" stroke="#4f46e5" stroke-width="1"/>
  <rect x="265" y="290" width="40" height="25" rx="3" fill="url(#cardGradient)" stroke="#4f46e5" stroke-width="1"/>
  <rect x="270" y="285" width="40" height="25" rx="3" fill="url(#cardGradient)" stroke="#4f46e5" stroke-width="1.5"/>
  
  <!-- AI sparkles -->
  <circle cx="330" cy="280" r="3" fill="#fbbf24"/>
  <circle cx="340" cy="300" r="2" fill="#fbbf24"/>
  <circle cx="325" cy="270" r="1.5" fill="#fbbf24"/>
  
  <!-- Main title -->
  <text x="420" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#1f2937">
    Cognito Cards
  </text>
  
  <!-- Subtitle -->
  <text x="420" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="500" fill="#6b7280">
    AI-Powered Flashcard Learning Platform
  </text>
  
  <!-- Feature highlights -->
  <text x="420" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#4f46e5">
    ✨ AI-Generated Cards  📚 Multiple Study Modes  🧠 Spaced Repetition
  </text>
  
  <!-- Bottom tagline -->
  <text x="420" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#6b7280">
    Transform your learning with intelligent flashcards
  </text>
  
  <!-- URL -->
  <text x="420" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#4f46e5">
    cognitocards.abdulhamidoguntade.com
  </text>
</svg>