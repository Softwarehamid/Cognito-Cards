<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGradient)" stroke="#4f46e5" stroke-width="2"/>
  
  <!-- Brain/AI symbol (simplified) -->
  <path d="M30 35 Q35 30 45 35 Q55 30 70 35 Q70 45 65 50 Q70 55 70 65 Q55 70 45 65 Q35 70 30 65 Q30 55 35 50 Q30 45 30 35 Z" 
        fill="url(#cardGradient)" stroke="#4f46e5" stroke-width="1.5" opacity="0.9"/>
  
  <!-- Flashcard stack effect -->
  <rect x="25" y="40" width="30" height="20" rx="3" fill="url(#cardGradient)" stroke="#4f46e5" stroke-width="1"/>
  <rect x="27" y="38" width="30" height="20" rx="3" fill="url(#cardGradient)" stroke="#4f46e5" stroke-width="1"/>
  <rect x="29" y="36" width="30" height="20" rx="3" fill="url(#cardGradient)" stroke="#4f46e5" stroke-width="1.5"/>
  
  <!-- AI sparkle dots -->
  <circle cx="65" cy="30" r="2" fill="#fbbf24"/>
  <circle cx="75" cy="40" r="1.5" fill="#fbbf24"/>
  <circle cx="70" cy="25" r="1" fill="#fbbf24"/>
  
  <!-- Letter "C" for Cognito -->
  <text x="50" y="75" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" 
        font-size="16" font-weight="bold" fill="#4f46e5">C</text>
</svg>